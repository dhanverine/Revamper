<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revamper ring variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:Rajdhani,system-ui,sans-serif}
#backdrop{position:fixed;inset:0;background:
  radial-gradient(1000px 640px at 50% 46%,#101a33 0%,#080c18 58%,#04050a 100%)}
#backdrop::after{content:"";position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}
#note{position:fixed;top:18px;left:20px;font:400 11px/1.5 "JetBrains Mono",ui-monospace,monospace;color:rgba(255,255,255,.42);letter-spacing:.04em;max-width:340px}
#scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1100px}
#stage{width:600px;height:600px;position:relative;transform-style:preserve-3d}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(var(--z,0px));pointer-events:none}
.layer svg{position:absolute;left:0;top:0;width:600px;height:600px;overflow:visible}
:root{--line:#F6E700;--hot:#F6E700;--fill:#F3680F;--text:#FFD0B8;--drop:#97E4C2;--accent:#F3680F;--slice:rgba(17,31,67,.86);--hubbg:rgba(9,18,42,.94);
 --dim:color-mix(in srgb,var(--line) 34%,transparent);--faint:color-mix(in srgb,var(--line) 12%,transparent);--hotfill:color-mix(in srgb,var(--fill) 42%,transparent)}
.ring svg *{vector-effect:non-scaling-stroke}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.spin{transform-origin:300px 300px;animation:spin 90s linear infinite}
.spin.rev{animation-duration:60s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{position:absolute;left:70px;top:70px;width:460px;height:460px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 292deg,var(--faint) 335deg,var(--dim) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 0 98px,#000 99px 226px,transparent 227px);mask:radial-gradient(circle,transparent 0 98px,#000 99px 226px,transparent 227px);
  animation:spin 7s linear infinite;will-change:transform}
/* entrance */
.in{transform-origin:300px 300px;animation:bloom 520ms cubic-bezier(.2,1.12,.3,1) both;animation-delay:calc(var(--i,0)*45ms)}
.sl{transform-origin:300px 300px;animation:bloom 460ms cubic-bezier(.2,1.12,.3,1) both;animation-delay:calc(120ms + var(--i,0)*34ms)}
@keyframes bloom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
/* slices */
.s .body{fill:var(--slice);stroke:var(--dim);stroke-width:1.2;transition:fill 90ms,stroke 90ms}
.s .glow{fill:none;stroke:var(--line);stroke-width:7;opacity:0;transition:opacity 110ms}
.s .lab{fill:var(--text);font:600 12px Rajdhani,system-ui,sans-serif;letter-spacing:.08em;text-anchor:middle;text-transform:uppercase;transition:fill 90ms}
.s .idx{fill:var(--dim);font:400 9px "JetBrains Mono",monospace;text-anchor:middle;transition:fill 90ms}
.s .gl{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke 90ms}
.s .sel{fill:none;stroke:var(--hot);stroke-width:3;opacity:0;transition:opacity 110ms}
.s .tick{stroke:var(--hot);stroke-width:1.5;opacity:0;transition:opacity 110ms}
.s.hot .body{fill:var(--hotfill);stroke:var(--hot)}
.s.hot .glow{opacity:.22}
.s.hot .sel,.s.hot .tick{opacity:1}
.s.hot .lab{fill:var(--hot)} .s.hot .idx{fill:var(--hot)} .s.hot .gl{stroke:var(--hot)}
.s.hit .body{fill:var(--drop);stroke:var(--drop);transition:none}
.hubT{fill:var(--hot);font:700 16px Rajdhani,system-ui,sans-serif;letter-spacing:.22em;text-anchor:middle;text-transform:uppercase}
.hubS{fill:var(--text);opacity:.8;font:400 8.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-anchor:middle;text-transform:uppercase}
.rd{fill:var(--text);opacity:.7;font:400 9px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.spin,.sweep{animation:none}.in,.sl{animation:fadeIn 120ms linear both}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.tilt{transform:none!important}}
#colours{position:fixed;top:16px;right:18px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font:400 10px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase}
#colours .row{display:flex;align-items:center;gap:8px}
.sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;transition:transform 150ms var(--ease-out)}
.sw:hover{transform:scale(1.08)} .sw:active{transform:scale(.96)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #fff}
.sw:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:3px}
.sw.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#custom{display:flex;gap:12px;padding:8px 10px;border-radius:12px;background:rgba(10,10,10,.7);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
#custom[hidden]{display:none}
#custom label{display:flex;flex-direction:column;align-items:center;gap:5px}
#custom input{width:34px;height:26px;padding:0;border:0;background:none;cursor:pointer}
/* picker (spec, verbatim) */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="note">REVAMPER RING / PROTOTYPE<br>Move the mouse over the ring: it tilts, slices light up. Click a slice to "drop". Colour swatches top right (key C cycles). Keys: 1 2, arrows, R replays.</div>
<aside id="colours" aria-label="Colour"><div class="row" id="sws"></div><div id="custom" hidden><label>Line<input type="color" id="cLine" value="#38e8ff"></label><label>Highlight<input type="color" id="cHot" value="#f6e700"></label><label>Drop<input type="color" id="cDrop" value="#ff7a2f"></label></div></aside>
<div id="scene"><div id="stage"></div></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Reactor</button>
  <button class="proto-picker-item">Console</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
const C=300,N=6,STEP=Math.PI*2/N,GAP=0.035,RI=92,RO=172;
const ACTIONS=[
 {n:"Convert",sub:"format to format",g:"M-7 -3H5M2 -6L5 -3L2 0M7 4H-5M-2 1L-5 4L-2 7"},
 {n:"Compress",sub:"smaller, same look",g:"M-7 -7L-2 -2M-2 -6V-2H-6M7 7L2 2M2 6V2H6"},
 {n:"Crop",sub:"frame and ratio",g:"M-4 -8V4H8M-8 -4H4V8"},
 {n:"Trim",sub:"set in and out",g:"M-7 -4L7 5M-7 5L7 -4"},
 {n:"Merge",sub:"join files",g:"M-7 -7L0 0M7 -7L0 0M0 0V8"},
 {n:"Extract",sub:"audio, pages, frames",g:"M0 -8V3M-4 -1L0 3L4 -1M-7 7H7"}
];
const f=n=>(+n).toFixed(2), P=(r,a)=>[C+r*Math.cos(a),C+r*Math.sin(a)], D=d=>d*Math.PI/180;
const sector=(ri,ro,a0,a1)=>{const[x0,y0]=P(ro,a0),[x1,y1]=P(ro,a1),[x2,y2]=P(ri,a1),[x3,y3]=P(ri,a0);return `M${f(x0)} ${f(y0)}A${ro} ${ro} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${ri} ${ri} 0 0 0 ${f(x3)} ${f(y3)}Z`};
const arc=(r,a0,a1)=>{const[x0,y0]=P(r,a0),[x1,y1]=P(r,a1);return `M${f(x0)} ${f(y0)}A${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${f(x1)} ${f(y1)}`};
const ang=i=>[-Math.PI/2+i*STEP+GAP,-Math.PI/2+(i+1)*STEP-GAP];
function ticks(r,count,len,major){let m='',M='';for(let k=0;k<count;k++){const a=k/count*Math.PI*2,big=k%major===0;const[x0,y0]=P(r,a),[x1,y1]=P(r+(big?len*2:len),a);const seg=`M${f(x0)} ${f(y0)}L${f(x1)} ${f(y1)}`;if(big)M+=seg;else m+=seg}return `<path d="${m}" stroke="var(--dim)" stroke-width="1" fill="none"/><path d="${M}" stroke="var(--line)" stroke-width="1.4" fill="none"/>`}
function segArcs(r,spans,w,op){return spans.map(([a,b],i)=>`<path d="${arc(r,D(a),D(b))}" stroke="var(--line)" stroke-width="${w}" fill="none" opacity="${op[i%op.length]}" stroke-linecap="butt"/>`).join('')}
function slices(){return ACTIONS.map((a,i)=>{const[a0,a1]=ang(i),mid=(a0+a1)/2,[lx,ly]=P(124,mid),[ix,iy]=P(161,a0+.2),[t0x,t0y]=P(RO+8,mid),[t1x,t1y]=P(RO+22,mid);
 return `<g class="s sl" data-i="${i}" style="--i:${i}"><path class="glow" d="${sector(RI,RO,a0,a1)}"/><path class="body" d="${sector(RI,RO,a0,a1)}"/><path class="sel" d="${arc(RO+9,a0+.05,a1-.05)}"/><path class="tick" d="M${f(t0x)} ${f(t0y)}L${f(t1x)} ${f(t1y)}"/><text class="idx" x="${f(ix)}" y="${f(iy+3)}">0${i+1}</text><g transform="translate(${f(lx)} ${f(ly-8)}) scale(1.15)"><path class="gl" d="${a.g}"/></g><text class="lab" x="${f(lx)}" y="${f(ly+17)}">${a.n}</text></g>`}).join('')}
function hub(hex){const shape=hex?`<polygon points="${[0,1,2,3,4,5].map(k=>P(82,D(30+k*60)).map(f).join(',')).join(' ')}" fill="var(--hubbg)" stroke="var(--line)" stroke-width="1.4"/>`:`<circle cx="${C}" cy="${C}" r="82" fill="var(--hubbg)" stroke="var(--line)" stroke-width="1.4"/>`;
 return `${shape}<circle cx="${C}" cy="${C}" r="68" fill="none" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2 5"/><path d="M${C-40} ${C-34}H${C-26}M${C+26} ${C-34}H${C+40}M${C-40} ${C+34}H${C-26}M${C+26} ${C+34}H${C+40}" stroke="var(--dim)" stroke-width="1" fill="none"/><text class="rd" x="${C}" y="${C-36}" text-anchor="middle" id="hubTop">READY</text><text class="hubT" id="hubT" x="${C}" y="${C+4}">DROP</text><text class="hubS" id="hubS" x="${C}" y="${C+22}">pick an action</text>`}
function brackets(){const o=22,l=26,s=600-o;return `<path d="M${o} ${o+l}V${o}H${o+l}M${s-l} ${o}H${s}V${o+l}M${s} ${s-l}V${s}H${s-l}M${o+l} ${s}H${o}V${s-l}" stroke="var(--accent)" stroke-width="1.6" fill="none"/>`}
function readouts(){return `<g class="rd"><text x="30" y="${C-4}">INPUT</text><text x="30" y="${C+10}" style="fill:var(--line)">FILES</text><path d="M30 ${C+20}H110" stroke="var(--dim)"/><text x="570" y="${C-4}" text-anchor="end">ENGINE</text><text x="570" y="${C+10}" text-anchor="end" style="fill:var(--line)">ON DEVICE</text><path d="M490 ${C+20}H570" stroke="var(--dim)"/></g><path d="M118 ${C}H${C-RO-30}M${C+RO+30} ${C}H482" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 4" fill="none"/>`}
function burst(){let s='';for(let k=0;k<48;k++){const a=k/48*Math.PI*2,[x,y]=P(262,a);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${k%4===0?2.4:1.3}" fill="var(--line)" opacity="${k%4===0?.8:.4}"/>`}return s}
function build(v){
 const sweep=v===1||v===3?`<div class="sweep"></div>`:'';
 let back='',mid='';
 if(v===1){back=`<g class="spin">${ticks(256,120,5,5)}</g><circle cx="${C}" cy="${C}" r="286" fill="none" stroke="var(--faint)"/><circle cx="${C}" cy="${C}" r="236" fill="none" stroke="var(--dim)" stroke-dasharray="2 7"/>`;
  mid=`<g class="spin rev">${segArcs(212,[[-170,-140],[-125,-85],[-70,-20],[-5,25],[40,100],[115,145],[160,200]],2.6,[.9,.5,.7])}</g>`}
 if(v===2){back=`<g class="spin">${burst()}</g><circle cx="${C}" cy="${C}" r="238" fill="none" stroke="var(--dim)" stroke-width="1"/>`;
  mid=`<g class="spin rev">${segArcs(208,[[-84,-24],[-12,34],[58,142],[168,236]],13,[.95,.55,.8])}</g><circle cx="${C}" cy="${C}" r="196" fill="none" stroke="var(--dim)"/>`}
 if(v===3){back=`<g class="spin">${ticks(252,96,4,6)}</g><circle cx="${C}" cy="${C}" r="272" fill="none" stroke="var(--faint)"/>${brackets()}${readouts()}`;
  mid=`<g class="spin rev">${segArcs(214,[[-160,-100],[-90,-30],[-10,50],[70,130],[150,200]],2.2,[.9,.45,.7])}</g>`}
 return `<div class="ring" data-v="${v}"><div class="tilt" id="tilt">
  <div class="layer" style="--z:-52px"><svg viewBox="0 0 600 600"><g class="in" style="--i:0">${back}</g></svg></div>
  <div class="layer" style="--z:-26px">${sweep}<svg viewBox="0 0 600 600"><g class="in" style="--i:1">${mid}</g></svg></div>
  <div class="layer" style="--z:0px"><svg viewBox="0 0 600 600" style="pointer-events:none">${slices()}</svg></div>
  <div class="layer" style="--z:42px"><svg viewBox="0 0 600 600"><g class="in" style="--i:3">${hub(v===2)}</g></svg></div>
 </div></div>`}
const variants=[()=>build(2),()=>build(3)];

/* interaction: pointer drives tilt and hot slice (in the app, the drag position drives this) */
let tx=0,ty=0,cx=0,cy=0,raf=0,hot=-1;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sliceAt(dx,dy){const d=Math.hypot(dx,dy);if(d<RI-6||d>RO+24)return -1;let a=Math.atan2(dy,dx)+Math.PI/2;if(a<0)a+=Math.PI*2;return Math.floor(a/STEP)%N}
function setHot(i){if(i===hot)return;hot=i;const els=document.querySelectorAll('.s');els.forEach((el,k)=>el.classList.toggle('hot',k===i));
 const T=document.getElementById('hubT'),S=document.getElementById('hubS'),R=document.getElementById('hubTop');if(!T)return;
 if(i<0){T.textContent='DROP';S.textContent='pick an action';R.textContent='READY'}else{T.textContent=ACTIONS[i].n;S.textContent=ACTIONS[i].sub;R.textContent='0'+(i+1)+' / 06'}}
function frame(){cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;const t=document.getElementById('tilt');if(t)t.style.transform=`rotateX(${f(cy)}deg) rotateY(${f(cx)}deg)`;
 if(Math.abs(tx-cx)>.01||Math.abs(ty-cy)>.01)raf=requestAnimationFrame(frame);else raf=0}
addEventListener('pointermove',e=>{const dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight/2;setHot(sliceAt(dx,dy));
 if(!reduce){tx=Math.max(-1,Math.min(1,dx/(innerWidth/2)))*9;ty=-Math.max(-1,Math.min(1,dy/(innerHeight/2)))*9;if(!raf)raf=requestAnimationFrame(frame)}});
addEventListener('pointerleave',()=>{setHot(-1);tx=ty=0;if(!raf)raf=requestAnimationFrame(frame)});
addEventListener('pointerdown',e=>{const i=sliceAt(e.clientX-innerWidth/2,e.clientY-innerHeight/2);if(i<0)return;const el=document.querySelectorAll('.s')[i];el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),260)});

/* colour options */
const mix=(a,b,t)=>`color-mix(in srgb,${a} ${t}%,${b})`;
const PALETTES=[
 {id:'cyan',name:'HUD cyan',line:'#38E8FF',hot:'#E4FDFF',fill:'#38E8FF',text:'#BFF6FF',drop:'#FFB347',accent:'#38E8FF',slice:'rgba(4,22,34,.82)',hubbg:'rgba(3,14,24,.94)'},
 {id:'sanzo',name:'Vivid Sanzo',line:'#F6E700',hot:'#F6E700',fill:'#F3680F',text:'#FFD0B8',drop:'#97E4C2',accent:'#F3680F',slice:'rgba(17,31,67,.86)',hubbg:'rgba(9,18,42,.94)'},
 {id:'blend',name:'Cyan + citron',line:'#38E8FF',hot:'#F6E700',fill:'#F6E700',text:'#D8FBFF',drop:'#F3680F',accent:'#F6E700',slice:'rgba(6,20,40,.86)',hubbg:'rgba(4,14,30,.94)'},
 {id:'red',name:'Red alert',line:'#FF5A3C',hot:'#FFD9CF',fill:'#FF3B1F',text:'#FFB8A8',drop:'#38E8FF',accent:'#38E8FF',slice:'rgba(32,6,8,.86)',hubbg:'rgba(20,4,6,.94)'},
 {id:'custom',name:'Custom'}
];
let pal=1;const root=document.documentElement;
try{const sv=localStorage.getItem('revamper-pal');if(sv!==null)pal=Math.min(+sv,PALETTES.length-1)||0}catch(_){}
function applyPalette(i,save=true){pal=i;let p=PALETTES[i];
 if(p.id==='custom'){const l=cLine.value,h=cHot.value,d=cDrop.value;p={line:l,hot:h,fill:h,text:mix(l,'#fff',45),drop:d,accent:h,slice:mix(l,'#050810',9)+'',hubbg:mix(l,'#03060c',5)}}
 ['line','hot','fill','text','drop','accent','slice','hubbg'].forEach(k=>root.style.setProperty('--'+k,p[k]));
 document.querySelectorAll('.sw').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
 document.getElementById('custom').hidden=PALETTES[i].id!=='custom';
 if(save)try{localStorage.setItem('revamper-pal',i)}catch(_){}}
const sws=document.getElementById('sws'),cLine=document.getElementById('cLine'),cHot=document.getElementById('cHot'),cDrop=document.getElementById('cDrop');
PALETTES.forEach((p,i)=>{const b=document.createElement('button');b.className='sw'+(p.id==='custom'?' custom':'');b.title=p.name;b.setAttribute('aria-label',p.name+' colours');
 if(p.id!=='custom')b.style.background=`linear-gradient(135deg,${p.line} 0 50%,${p.fill} 50% 100%)`;b.addEventListener('click',()=>applyPalette(i));sws.appendChild(b)});
[cLine,cHot,cDrop].forEach(el=>el.addEventListener('input',()=>applyPalette(PALETTES.length-1)));
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='c'||e.key==='C')applyPalette((pal+1)%PALETTES.length)});
applyPalette(pal,false);

/* picker wiring (spec) */
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';hot=-1;requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
