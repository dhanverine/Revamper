[package]
name = "revamper"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
